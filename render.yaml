services:
  - type: web
    name: rate-limiter
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      - key: STORE
        value: persistent
      - key: DATABASE_URL
        fromDatabase:
          name: rate-limiter-db
          property: connectionString

databases:
  - name: rate-limiter-db
    plan: free
    region: frankfurt
